<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; frame-src 'self' about:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Редактор портфолио</title>
<link rel="stylesheet" href="style.css">
<script src="editor.js" defer></script>
</head>
<body>
<main>
<h1>Редактор портфолио</h1>
<div class="actions">
<label>Страница <select id="page"></select></label>
<button id="save" disabled>Сохранить черновик</button>
<button id="preview" disabled>Предпросмотр</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<div id="fields"></div>
<iframe id="view" title="Предпросмотр страницы" sandbox hidden></iframe>
<section id="publishing" hidden>
<h2>Публикация</h2>
<p>Нужен ключ GitHub только для репозитория portl с доступом Contents: Read and write. Ключ отправляется напрямую в GitHub и не сохраняется.</p>
<p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Создать ключ в GitHub</a></p>
<label>Ключ GitHub <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
<button id="publish" disabled>Опубликовать страницу</button>
</section>
</main>
</body>
</html>
